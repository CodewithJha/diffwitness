name: Feature request
description: Suggest an improvement to DiffWitness.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the roadmap (docs/ROADMAP.md) first. DiffWitness keeps findings deterministic and evidence-based:
        AI may explain results but never decides findings, status or exit codes, and the hosted demo only runs built-in scenarios.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like DiffWitness to do? Commands, config or output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other tools.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
